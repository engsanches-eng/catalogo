<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glauber Sanches | Bonfiglioli</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E3001B;
    --dark: #0a0a0a;
    --navy: #0d1f3c;
    --navy-mid: #122848;
    --navy-light: #1a3560;
    --cyan: #00b8d9;
    --white: #ffffff;
    --text-muted: rgba(255,255,255,0.55);
  }

  html, body {
    min-height: 100%;
    background: #06101e;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: 'Barlow', sans-serif;
    padding: 24px 16px 48px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, var(--navy) 0%, #0b1e38 60%, #091527 100%);
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0,184,217,0.18),
      0 32px 80px rgba(0,0,0,0.7),
      0 0 60px rgba(0,184,217,0.05) inset;
    position: relative;
    animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Top accent bar */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red) 0%, var(--cyan) 100%);
  }

  /* Background texture */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,184,217,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 30% at 80% 80%, rgba(227,0,27,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Industrial BG pattern */
  .bg-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,1) 39px, rgba(255,255,255,1) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,1) 39px, rgba(255,255,255,1) 40px);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 32px 40px;
    gap: 0;
  }

  /* PHOTO */
  .photo-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--red) 100%);
    margin-bottom: 26px;
    flex-shrink: 0;
  }

  .photo-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--navy-light);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-placeholder {
    font-size: 46px;
    opacity: 0.4;
  }

  /* NAME */
  .name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 2.4rem;
    letter-spacing: 0.01em;
    color: var(--white);
    text-align: center;
    line-height: 1;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  /* ROLE PILL */
  .role-pill {
    background: rgba(227,0,27,0.15);
    border: 1px solid rgba(227,0,27,0.35);
    color: #ff6b7a;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 6px 20px;
    border-radius: 100px;
    margin-bottom: 36px;
  }

  /* DIVIDER */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,184,217,0.25), transparent);
    margin-bottom: 32px;
  }

  /* CONTACTS */
  .contacts {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 36px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--white);
    transition: transform 0.2s ease, opacity 0.2s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,184,217,0.2);
  }

  .contact-item * {
    pointer-events: none;
  }

  .contact-item:hover {
    transform: translateX(4px);
    opacity: 0.85;
  }

  .icon-wrap {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }

  .contact-item:hover .icon-wrap {
    background: rgba(0,184,217,0.12);
    border-color: rgba(0,184,217,0.3);
  }

  .icon-wrap svg {
    width: 18px;
    height: 18px;
  }

  .contact-label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1;
    margin-bottom: 3px;
  }

  .contact-value {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--white);
    line-height: 1.2;
  }

  .contact-value.highlight {
    color: var(--cyan);
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }

  /* SAVE CONTACT BUTTON */
  .save-btn {
    width: 100%;
    margin-top: 8px;
    padding: 16px 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--cyan) 0%, #0090b8 100%);
    color: white;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 20px rgba(0,184,217,0.25);
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    animation: pulse-fade 4s ease-in-out infinite;
  }

  @keyframes pulse-fade {
    0%, 100% {
      opacity: 0.75;
      box-shadow: 0 6px 20px rgba(0,184,217,0.3);
    }
    50% {
      opacity: 1;
      box-shadow: 0 10px 40px rgba(0,184,217,0.75), 0 0 60px rgba(0,184,217,0.5), 0 0 90px rgba(0,184,217,0.25);
    }
  }

  .save-btn:hover {
    transform: translateY(-2px);
    animation: none;
    opacity: 1;
    box-shadow: 0 10px 28px rgba(0,184,217,0.7);
  }

  .save-btn:active {
    transform: translateY(0);
  }

  .save-btn svg {
    width: 18px;
    height: 18px;
  }

  /* DIVIDER 2 */
  .divider2 {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin-bottom: 28px;
  }

  /* LOGO AREA */
  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    color: var(--white);
    text-transform: uppercase;
  }

  .logo-text span {
    color: var(--red);
  }

  .logo-sub {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Bottom glow line */
  .bottom-bar {
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    margin-top: 28px;
    opacity: 0.4;
  }
</style>
</head>
